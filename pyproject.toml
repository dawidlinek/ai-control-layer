[project]
name = "ai-control-layer"
version = "0.1.0"
description = "AI Control Layer: company-wide AI gateway (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "acl-gateway",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway"]

[tool.uv.sources]
acl-gateway = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["gateway/tests", "tests"]
addopts = "--import-mode=importlib -ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
  "live: needs a real model server (LOCAL_LLM_BASE_URL / GEMINI_API_KEY); run with `make test-live`",
  "e2e: needs the docker-compose stack running (`make up`)",
  "slow: slower than 1 s",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["training", "panel", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "RUF012", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["acl"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]
