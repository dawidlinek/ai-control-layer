# yaml-language-server: $schema=../contracts/policy.schema.json
#
# Connectors, model registry, aliases and skills (concept §7).
# Upstream model names come from the environment (`env:NAME`) so the same policy works against
# vLLM, SGLang or Ollama on any box. Credentials live only in the gateway environment.

connectors:
  local:
    type: openai_compatible            # vLLM / SGLang / Ollama's /v1 endpoint
    base_url: env:LOCAL_LLM_BASE_URL
    api_key: env:LOCAL_LLM_API_KEY
    tier: local
    timeout_s: 120
  local-pl:                            # second vLLM server (own port) that serves Bielik
    type: openai_compatible
    base_url: env:LOCAL_PL_BASE_URL
    api_key: env:LOCAL_LLM_API_KEY
    tier: local
    timeout_s: 120
  gemini:
    type: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: env:GEMINI_API_KEY        # paid key; never leaves the gateway
    tier: cloud
    timeout_s: 60

models:
  # Model lineup (HANDOFF §7.1): Gemini Flash = fast cloud (default for normal work), Gemini Pro = strong cloud
  # (`auto` picks it for complex requests), Qwen3.8-27B on the local GPU = everything confidential,
  # Bielik = local Polish-language specialist (user decision 2026-10-04).
  #
  # How users pick (by alias): cloud `flash` / `smart` (cheap, fast) or `pro` / `smart-pro` (strong); local `qwen`
  # / `local` / `fast` or `bielik`; or `auto` (the router decides). Whatever the pick, sensitivity escalation wins:
  # confidential/restricted data or a route_local obligation is served locally (router steps 2b/3). An admin routing
  # rule such as "Polish legal texts go to Bielik" is a `specialist` block on the target model (see local/bielik).
  - id: local/qwen3.8-27b
    connector: local
    upstream_model: env:LOCAL_GENERAL_MODEL     # e.g. the Ollama / vLLM tag of Qwen3.8-27B
    aliases: [local, fast, qwen]
    tags: {role: "local, all confidential work", family: qwen}
    capabilities: [chat, tools]
    data_classes: [public, internal, confidential, restricted]
    pricing: {usd_per_gpu_second: 0.0006, gpu_seconds_per_1k_tokens: 0.5}

  # Prompt-configured specialist stand-in (no fine-tuned model in the demo): same Qwen upstream with a fixed system
  # prompt; `auto` routes here for task=loan_memo, which keeps the auto → specialist mechanism exercised.
  - id: local/loan-memo
    connector: local
    upstream_model: env:LOCAL_GENERAL_MODEL
    tags: {role: "specialist (prompt-configured on Qwen)", task: loan_memo}
    data_classes: [public, internal, confidential]
    pricing: {usd_per_gpu_second: 0.0006, gpu_seconds_per_1k_tokens: 0.3}
    specialist:
      task: loan_memo
      min_confidence: 0.8
      examples:
        - "Summarise this loan application into a credit memo."
        - "Prepare a credit memo from this mortgage application."
        - "Podsumuj wniosek kredytowy klienta i przygotuj notatkę kredytową."
    system_prompt: >-
      You are a credit analyst. From the application, write a concise credit memo in English: applicant
      (pseudonym), amount, purpose, income, liabilities, DTI, risks, recommendation.

  # Local Polish-language specialist (Bielik). `auto` routes here when the prompt is close (kNN over `examples`,
  # see acl.routing.specialist) to the Polish legal-text task; users can also pick it directly with `bielik`.
  # LOCAL_PL_BASE_URL or LOCAL_BIELIK_MODEL unset → the model is reported unavailable and the router falls back to the degraded local
  # target (Qwen); `auto` simply skips it.
  - id: local/bielik
    connector: local-pl
    upstream_model: env:LOCAL_BIELIK_MODEL      # e.g. the Ollama / vLLM tag of Bielik 11B Instruct
    aliases: [bielik]
    tags: {role: "local, Polish language specialist", family: bielik, task: polish_legal}
    capabilities: [chat]
    data_classes: [public, internal, confidential, restricted]
    pricing: {usd_per_gpu_second: 0.0006, gpu_seconds_per_1k_tokens: 0.5}
    specialist:
      task: polish_legal
      min_confidence: 0.5
      examples:
        - "Przeanalizuj tę umowę najmu pod kątem klauzul niedozwolonych."
        - "Jakie są skutki prawne odstąpienia od umowy sprzedaży według Kodeksu cywilnego?"
        - "Wyjaśnij art. 471 Kodeksu cywilnego o odpowiedzialności za niewykonanie zobowiązania."
        - "Sporządź projekt pozwu o zapłatę zgodnie z Kodeksem postępowania cywilnego."
        - "Czy ten regulamin sklepu internetowego jest zgodny z ustawą o prawach konsumenta?"
        - "Przygotuj projekt umowy zlecenia lub o dzieło i wskaż ryzyka prawne dla zamawiającego."
        - "Jakie są terminy i wymogi formalne apelacji w postępowaniu cywilnym?"
        - "Jaki termin przedawnienia roszczeń wynika z przepisów Kodeksu cywilnego?"
        - "Zredaguj aneks do umowy o pracę zgodnie z Kodeksem pracy."
        - "Zinterpretuj przepis rozporządzenia dotyczący obowiązków administratora danych."

  - id: local/embed
    connector: local
    upstream_model: env:LOCAL_EMBED_MODEL
    tags: {role: "embeddings (similarity, insights)"}
    capabilities: [embeddings]
    data_classes: [public, internal, confidential, restricted]

  - id: local/judge
    connector: local
    upstream_model: env:LOCAL_JUDGE_MODEL       # the L2 judge reuses the local Qwen with judge prompts
    tags: {role: judge}
    data_classes: [public, internal, confidential, restricted]

  - id: gemini/flash
    connector: gemini
    upstream_model: env:GEMINI_MODEL
    aliases: [smart, flash]
    tags: {role: fast cloud}
    capabilities: [chat, tools]
    data_classes: [public, internal]   # confidential/restricted never go to the cloud (LOCK-01)
    pricing: {in_per_1k: 0.0003, out_per_1k: 0.0025}   # illustrative

  - id: gemini/pro
    connector: gemini
    upstream_model: env:GEMINI_PRO_MODEL
    aliases: [smart-pro, pro]
    tags: {role: strong cloud}
    capabilities: [chat, tools]
    data_classes: [public, internal]
    pricing: {in_per_1k: 0.00125, out_per_1k: 0.01}    # illustrative

aliases:
  auto:
    strategy: specialist_then_rules
    description: Specialist by task (loan memo, Polish legal text), else sensitivity × complexity × budget rules (Flash by default, Pro when complex)

skills:
  skill/loan-memo-summary:
    description: Turn a loan application into a structured credit memo
    template: "Write a credit memo for the following application:\n\n{application}"
    input_schema:
      type: object
      properties: {application: {type: string, maxLength: 20000}}
      required: [application]
      additionalProperties: false
    model: local/loan-memo
    preset: strict
    data_classes: [public, internal, confidential]
