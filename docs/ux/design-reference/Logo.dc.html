<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Style"},"accent":{"editor":"color","options":["#4C8DFF","#2BB3A3","#D97757","#A78BFA"],"default":"#4C8DFF","section":"Style"},"$preview":{"width":1320,"height":780}}'>
function shade(hex, t) {
  const n = parseInt(hex.replace('#', ''), 16);
  const f = (v) => Math.round(v * (1 - t)).toString(16).padStart(2, '0');
  return '#' + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') !== 'light';
    const accent = this.props.accent ?? '#4C8DFF';
    const c = dark
      ? { bg: '#0e1013', surface: '#15181c', border: '#272c33', text: '#e7e9ec', muted: '#9ba4ae' }
      : { bg: '#f3f4f6', surface: '#ffffff', border: '#dce0e5', text: '#14171b', muted: '#56606b' };
    c.accent = dark ? accent : shade(accent, 0.32);
    c.onAccent = dark ? '#0e1013' : '#ffffff';
    return {
      c: c,
      lockups: [
        { bg: '#0e1013', fg: '#e7e9ec', muted: '#9ba4ae', bd: '#272c33' },
        { bg: '#ffffff', fg: '#14171b', muted: '#56606b', bd: '#dce0e5' }
      ],
      sizes: [64, 40, 24, 16].map((px) => ({ px: px, r: Math.round(px * 0.22), icon: Math.round(px * 0.68) }))
    };
  }
}
</script>
