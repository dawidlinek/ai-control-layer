# Narrow door from the locked OpenCode network to Keycloak: only the two endpoints the device-code login and
# token refresh need (RFC 8628 device authorization + token), POST only. Everything else (admin console, account
# console, user info, registrations, other realms) answers 403. Keycloak itself stays on the default network.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/realms/acl/protocol/openid-connect/(auth/device|token)$ {
        limit_except POST { deny all; }
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        default_type text/plain;
        return 403 "forbidden by idp-gate\n";
    }
}
