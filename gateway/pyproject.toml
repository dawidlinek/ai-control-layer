[project]
name = "acl-gateway"
version = "0.1.0"
description = "AI Control Layer gateway (package `acl`)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "ruamel.yaml>=0.18",
  "watchfiles>=1.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "mcp>=1.20",
  "pyjwt[crypto]>=2.10",
  "cryptography>=43",
  "sse-starlette>=2.1",
  "sqlglot>=25",
  "google-re2>=1.1",
  "yara-python>=4.5",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acl"]
