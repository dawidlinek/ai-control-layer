# SEC-PII-01 — PII tier T0 (regex + validators). Synthetic, checksum-valid values only.
# (Runner note: `redaction` expectations assume a PseudonymVault is registered; without one the replacement is a
#  typed mask `[REDACTED:<TYPE>]` and only the raw-value absence holds.)

# ---- negatives: sensitive data that must be handled ---------------------------------------------------------------
- id: pii-pesel-valid
  control: SEC-PII-01
  kind: negative
  pair: pii-pesel
  point: ingress
  input: "Mój PESEL to 44051401359, proszę o kopię umowy."
  expect:
    action: pseudonymise
    rule_id: SEC-PII-01
    redaction: {not_contains: ["44051401359"]}
  matrix: {balanced: pseudonymise, strict: route_local, paranoid: route_local}

- id: pii-pesel-monitor-preset-never-enforces
  control: SEC-PII-01
  kind: negative
  pair: pii-pesel
  point: ingress
  preset: monitor
  input: "Mój PESEL to 44051401359, proszę o kopię umowy."
  expect: {action: monitor, rule_id: null}   # monitor verdicts do not appear in decision.rule_ids

- id: pii-pesel-line-split
