# SEC-BUDGET-01 (budget) and SEC-LOOP-01 (loop_detector): budgets, rate limits, tool-call and loop limits.
#
# The case runner only calls `Engine.evaluate` (never commit), so the ledger and the loop history stay empty and
# every case here is a *stateless* trigger:
#   * pre-dispatch estimate vs a limit: tokens = input + requested `max_tokens`, GPU-seconds from the model's
#     `gpu_seconds_per_1k_tokens` (model `auto` is priced as the local target, 0.5 s per 1k tokens);
#   * `session: {step, tool_depth}` carries the counters the session store would hold (tool_depth is the
#     tool-call count of the session, step the number of model calls).
# Tiny limits come from two fixtures in policy/budgets.yaml that no real principal can match:
#   agent `ci-budget-probe`   tokens_session 400, gpu_seconds_session 0.1, tool_calls_session 2
#   user  `budget-probe-user` tokens_session 400
# Stateful behaviour (repeats, rate limit, spend spike, breaker, degrade) is covered by gateway/tests/test_2d_*.py.

# ------------------------------------------------------------------ SEC-BUDGET-01

- id: budget-token-overrun-blocked
  control: SEC-BUDGET-01
  kind: negative
  pair: budget-token-overrun
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  input:
    messages: [{role: user, content: "Summarise the attached report."}]
    params: {max_tokens: 500}
  matrix: {balanced: block, strict: block, paranoid: block}
  expect: {action: block, rule_id: SEC-BUDGET-01}

- id: budget-token-under-cap-allowed
  control: SEC-BUDGET-01
  kind: positive
  pair: budget-token-overrun
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  input:
    messages: [{role: user, content: "Summarise the attached report."}]
    params: {max_tokens: 20}
  expect: {action: allow, rule_id: null}

- id: budget-gpu-second-overrun-blocked
  control: SEC-BUDGET-01
  kind: negative
  pair: budget-gpu-overrun
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  # 305 tokens fit the 400-token session cap, but 305/1000 * 0.5 = 0.15 GPU-seconds exceed the 0.1 cap
  input:
    messages: [{role: user, content: "Translate this."}]
    params: {max_tokens: 300}
  expect: {action: block, rule_id: SEC-BUDGET-01}

- id: budget-gpu-second-under-cap-allowed
  control: SEC-BUDGET-01
  kind: positive
  pair: budget-gpu-overrun
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  input:
    messages: [{role: user, content: "Translate this."}]
    params: {max_tokens: 100}
  expect: {action: allow, rule_id: null}

- id: budget-tool-calls-per-session-exceeded
  control: SEC-BUDGET-01
  kind: negative
  pair: budget-tool-calls
  point: tool_call
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  session: {tool_depth: 2}
  input: {tool: opencode.bash, arguments: {command: "ls"}}
  expect: {action: block, rule_id: SEC-BUDGET-01}

- id: budget-tool-calls-within-session-cap-allowed
  control: SEC-BUDGET-01
  kind: positive
  pair: budget-tool-calls
  point: tool_call
  principal: {username: probe, groups: [developers], agent_id: ci-budget-probe}
  session: {tool_depth: 1}
  input: {tool: opencode.bash, arguments: {command: "ls"}}
  expect: {action: allow, rule_id: null}

- id: budget-user-limit-exceeded
  control: SEC-BUDGET-01
  kind: negative
  pair: budget-user-limit
  principal: {username: budget-probe-user, groups: [developers]}
  input:
    messages: [{role: user, content: "Explain the build failure."}]
    params: {max_tokens: 500}
  expect: {action: block, rule_id: SEC-BUDGET-01}

- id: budget-user-soft-limit-still-allowed
  control: SEC-BUDGET-01
  kind: positive
  pair: budget-user-limit
  principal: {username: budget-probe-user, groups: [developers]}
  # ~355 of 400 tokens: above the 80 % soft threshold, below the hard limit → allowed (a budget_breach event
  # is raised by the commit hook, not asserted here)
  input:
    messages: [{role: user, content: "Explain the build failure."}]
    params: {max_tokens: 350}
  expect: {action: allow, rule_id: null}

