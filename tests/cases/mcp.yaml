  expect: {action: block, rule_id: SEC-MCP-01}

- id: mcp-collision-with-other-server
  control: SEC-MCP-01
  kind: negative
  pair: mcp-name-collision
  point: mcp_tools_list
  input:
    kind: mcp
    server: web
    method: tools/list
    tools:
      - {name: fetch, description: "Fetch a web page.", input_schema: {type: object, properties: {url: {type: string}}}}
      - {name: send_email, description: "Send an email.", input_schema: {type: object, properties: {to: {type: string}}}}
  expect: {action: block, rule_id: SEC-MCP-01}

- id: mcp-collision-duplicate-name-in-one-list
