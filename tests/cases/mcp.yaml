  expect: {action: block, rule_id: SEC-MCP-01}

# =========================================================================== SEC-MCP-02 positives
- id: mcp-init-clean
  control: SEC-MCP-02
  kind: positive
  pair: mcp-init-allowlist
  point: mcp_initialize
  principal: {username: anna, groups: [developers]}
  input: {kind: mcp, server: files, method: initialize, protocol_version: "2025-11-25", params: {protocolVersion: "2025-11-25"}}
  expect: {action: allow, rule_id: null}

- id: mcp-init-matching-method-header
  control: SEC-MCP-02
  kind: positive
  pair: mcp-header-body
  point: mcp_initialize
  input:
    kind: mcp
    server: files
    method: tools/call
    params: {name: read_file}
    headers: {Mcp-Method: tools/call, Mcp-Name: read_file}
  expect: {action: allow, rule_id: null}

- id: mcp-init-matching-resource-name-header
  control: SEC-MCP-02
  kind: positive
  pair: mcp-header-body
  point: mcp_initialize
  input:
    kind: mcp
    server: files
    method: resources/read
    params: {uri: "file:///README.md"}
    headers: {mcp-method: resources/read, mcp-name: "file:///README.md"}
  expect: {action: allow, rule_id: null}

- id: mcp-init-https-oauth-metadata
  control: SEC-MCP-02
  kind: positive
  pair: mcp-oauth-url
  point: mcp_initialize
  input:
    kind: mcp
    server: files
    method: initialize
    params: {resource_metadata: "https://auth.corp.example/.well-known/oauth-protected-resource", authorization_servers: ["https://login.corp.example/realms/acl"]}
  expect: {action: allow, rule_id: null}

- id: mcp-init-benign-server-instructions
  control: SEC-MCP-02
  kind: positive
  pair: mcp-server-instructions
  point: mcp_initialize
  input:
    kind: mcp
    server: files
    method: initialize
    params:
      instructions: "Paths are relative to the workspace root. Use list_files to discover directories."
      server_info: {name: files, title: "Workspace files"}
  expect: {action: allow, rule_id: null}

- id: mcp-init-client-ping-on-allowed-server
  control: SEC-MCP-02
  kind: positive
  pair: mcp-init-sampling
  point: mcp_initialize
  input: {kind: mcp, server: mail, method: ping}
  expect: {action: allow, rule_id: null}

- id: mcp-toolcall-declared-tool-of-allowed-server
  control: SEC-MCP-02
  kind: positive
  pair: mcp-toolcall-declared
  point: tool_call
  principal: {username: anna, groups: [developers]}
  input: {tool: files.read_file, server: files, arguments: {path: README.md}}
  expect: {action: allow, rule_id: null}

# =========================================================================== SEC-MCP-02 negatives
- id: mcp-init-unlisted-server
  control: SEC-MCP-02
