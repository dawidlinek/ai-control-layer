# SEC-TOOL-01 — tool tiers, grants, argument checkers (path / command / url / sql), monotonic confinement.
# Default principal: anna (developers, balanced). Tool call input: {tool, arguments, workspace_root, cwd}.
# Mapping: forbidden / protected / deny class → block (final); confirm tier, unlisted shell command, writes under
# paranoid → require_approval; safe read-only commands and in-workspace reads → allow.

# ---- negatives -----------------------------------------------------------------------------------------------------
- id: tool-bash-read-ssh-key
  control: SEC-TOOL-01
  kind: negative
  pair: tool-bash-read
  point: tool_call
  input: {tool: opencode.bash, arguments: {command: "cat ~/.ssh/id_rsa"}, workspace_root: /work/proj, cwd: /work/proj}
  expect: {action: block, rule_id: SEC-TOOL-01}

