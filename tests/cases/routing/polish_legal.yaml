    Wklejam fragment umowy najmu lokalu. Najemca zobowiązuje się do zapłaty czynszu, a wynajmujący do wydania lokalu.
    Strony zgodnie oświadczają, że umowa została zawarta na czas oznaczony. Kaucja zostanie zwrócona najemcy po
    zakończeniu najmu. Spory rozstrzyga sąd właściwy dla siedziby wynajmującego. Czy te postanowienia są zgodne z
    kodeksem cywilnym i czy któraś klauzula jest niedozwolona?
  expect: {model: local/bielik, tier: local, specialist: true}

