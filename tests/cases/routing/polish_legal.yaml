# Routing cases for the Polish-legal specialist rule (`auto` -> local/bielik): acl.routing.polish_legal + specialist.
#
# These are ROUTER cases, not engine cases: the system harness (tests/harness) evaluates the inspection engine and
# never routes, so this directory is not collected by it (tests/cases/*.yaml only). They are run by
# gateway/tests/test_polish_legal_cases.py against the real Router, seed policy and mock connectors.
#
# Case keys (same spirit as tests/cases/README.md):
#   id, control (ROUTE-PL-LEGAL), pair, input        as in the system cases
#   kind: negative   the detector must catch it: `auto` goes to local/bielik (negative = "caught")
#         positive   near-miss that must NOT be caught: the normal sensitivity x complexity rules decide
#   principal: {bielik: false}                  the principal has no grant for local/bielik (default true)
#   bielik: unavailable                         LOCAL_PL_BASE_URL / LOCAL_BIELIK_MODEL unset (default available)
#   data_class: public | internal | confidential | restricted   (default public; ignored when `matrix` is set)
#   expect: {model: <id>, tier: local|cloud, specialist: true|false (specialist step in the route trace)}
#   matrix: {<data_class>: <expected model>, ...}   one cell per data class, overrides expect.model

# ------------------------------------------------------------------ caught (kind: negative)

- id: pl-legal-demo-oral-lease
  control: ROUTE-PL-LEGAL
  kind: negative
  pair: pl-legal-single-umowa
  input: "Czy umowa najmu zawarta ustnie jest ważna według kodeksu cywilnego?"
  expect: {tier: local, specialist: true}
  matrix: {public: local/bielik, internal: local/bielik, confidential: local/bielik, restricted: local/bielik}

