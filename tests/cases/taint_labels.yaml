- id: taint-glob-result-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-unknown
  point: tool_result
  input: {tool: opencode.glob, content: "src/app.py src/util.py"}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, taint_absent: [untrusted, sensitive]}

- id: taint-history-unlabelled-tool-message-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-history
  point: ingress
  input:
    messages:
      - {role: user, content: "What is in the project root?"}
      - role: assistant
        content: null
        tool_calls: [{id: call_1, type: function, function: {name: files.list_files, arguments: '{"path": "/work/proj"}'}}]
      - {role: tool, tool_call_id: call_1, content: "README.md, src/, tests/"}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, taint_absent: [untrusted, sensitive]}

- id: taint-history-without-tool-messages-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-history
  point: ingress
  input:
    messages:
      - {role: user, content: "Explain how a hash map handles collisions."}
      - {role: assistant, content: "It chains entries or probes for a free slot."}
      - {role: user, content: "And what is the load factor?"}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, confidentiality: public, taint_absent: [untrusted, sensitive]}

- id: taint-allowed-listing-call-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-call
  point: tool_call
  input: {tool: files.list_files, arguments: {path: /work/proj}, workspace_root: /work/proj, cwd: /work/proj}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, taint_absent: [untrusted, sensitive]}

- id: taint-blocked-fetch-call-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-call
  point: tool_call
  input: {tool: web.fetch, arguments: {url: "http://169.254.169.254/latest/meta-data/"}}
  # a blocked call never reaches the model, so its labelled output cannot taint the session
  expect:
    action: block
    rule_id: SEC-TOOL-01
    labels_after: {integrity: trusted, taint_absent: [untrusted, sensitive]}

- id: taint-glob-call-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-read
  point: tool_call
  input: {tool: opencode.glob, arguments: {path: /work/proj}, workspace_root: /work/proj, cwd: /work/proj}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, taint_absent: [untrusted, sensitive]}

- id: taint-labels-never-fall-in-a-trusted-step
  control: SEC-TAINT-01
  kind: positive
  pair: taint-web
  point: tool_result
  session: untrusted_sensitive
  input: {tool: files.list_files, content: "README.md, src/, tests/"}
  # labels only rise: a harmless result does not lower what the session already carries (and raises nothing itself)
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: untrusted, confidentiality: confidential, taint: [untrusted, sensitive]}
