# SEC-TAINT-01 — session IFC label raising from tool traffic (concept §9 "Labels for IFC", §16).
# The control only LABELS: its verdict is `allow` with a label update, so these cases assert `expect.labels_after`
# (see tests/cases/README.md) instead of an intervention. Metrics treat a negative as a TP when the control raised the
# expected labels and a positive as a FP when it raised labels it should not have (harness/metrics.py).
# Tool catalogue (policy/tools.yaml): web.fetch / mail.read / opencode.read / files.read_file are `reads_untrusted`,
# mail.read / opencode.read / bank.query / governed.search_docs are `touches_sensitive`; tools without those labels
# (files.list_files, governed.list_dir, opencode.glob, mail.send) raise nothing; unknown tools are untrusted.
# Result contents are benign on purpose: only the label rules are under test, no other control may fire.

# ---- negatives: the control raises a label -------------------------------------------------------------------------
- id: taint-web-result-untrusted
  control: SEC-TAINT-01
  kind: negative
  pair: taint-web
  point: tool_result
  input: {tool: web.fetch, content: "Release notes for version 3.2: bug fixes and performance improvements."}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, confidentiality: public, taint: [untrusted], taint_absent: [sensitive]}

- id: taint-mail-result-untrusted-and-sensitive
  control: SEC-TAINT-01
  kind: negative
  pair: taint-mail
  point: tool_result
  input: {tool: mail.read, content: "Subject: quarterly planning. Body: see the attached agenda for Thursday."}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, confidentiality: confidential, taint: [untrusted, sensitive]}

- id: taint-bank-result-sensitive-not-untrusted
  control: SEC-TAINT-01
  kind: negative
  pair: taint-bank
  point: tool_result
  input: {tool: bank.query, content: "3 rows returned."}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: trusted, confidentiality: confidential, taint: [sensitive], taint_absent: [untrusted]}

- id: taint-unknown-tool-result-untrusted
  control: SEC-TAINT-01
  kind: negative
  pair: taint-unknown
  point: tool_result
  input: {tool: plugin.mystery_lookup, content: "lookup finished, nothing found."}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, taint: [untrusted]}

- id: taint-history-tool-message-untrusted
  control: SEC-TAINT-01
  kind: negative
  pair: taint-history
  point: ingress
  input:
    messages:
      - {role: user, content: "Summarise the page at the docs site."}
      - role: assistant
        content: null
        tool_calls: [{id: call_1, type: function, function: {name: web.fetch, arguments: '{"url": "https://docs.python.org/3/"}'}}]
      - {role: tool, tool_call_id: call_1, content: "Python 3 documentation home page."}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, taint: [untrusted]}

- id: taint-history-unmappable-tool-message-untrusted
  control: SEC-TAINT-01
  kind: negative
  pair: taint-history
  point: ingress
  input:
    messages:
      - {role: user, content: "Continue."}
      - {role: tool, tool_call_id: call_ghost, content: "result of a call this request never made"}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, taint: [untrusted]}

- id: taint-allowed-fetch-call-raises-labels-at-once
  control: SEC-TAINT-01
  kind: negative
  pair: taint-call
  point: tool_call
  input: {tool: web.fetch, arguments: {url: "https://docs.python.org/3/"}}
  # labelling is preset-independent (monitor included: the session still has to be tracked); matrix cells that expect
  # `allow` skip the rule_id check, the labels_after expectation is what makes every cell meaningful
  matrix: {monitor: allow, balanced: allow, strict: allow, paranoid: allow}
  expect:
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, taint: [untrusted]}

- id: taint-allowed-read-call-raises-both-labels
  control: SEC-TAINT-01
  kind: negative
  pair: taint-read
  point: tool_call
  input: {tool: opencode.read, arguments: {filePath: /work/proj/README.md}, workspace_root: /work/proj, cwd: /work/proj}
  expect:
    action: allow
    rule_id: SEC-TAINT-01
    labels_after: {integrity: untrusted, confidentiality: confidential, taint: [untrusted, sensitive]}

# ---- positives: near misses where nothing is raised ----------------------------------------------------------------
- id: taint-listing-result-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-web
  point: tool_result
  input: {tool: files.list_files, content: "README.md, src/, tests/"}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, confidentiality: public, taint_absent: [untrusted, sensitive]}

- id: taint-mail-send-result-raises-nothing
  control: SEC-TAINT-01
  kind: positive
  pair: taint-mail
  point: tool_result
  input: {tool: mail.send, content: "message queued"}
  expect:
    action: allow
    rule_id: null
    labels_after: {integrity: trusted, confidentiality: public, taint_absent: [untrusted, sensitive]}

- id: taint-directory-result-raises-nothing
  control: SEC-TAINT-01
