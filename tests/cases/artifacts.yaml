# SEC-ART-01 (model-artifact scanner) at the artifact_load point. Fixtures are generated in code by
# acl.artifacts.testing (`local_path: "fixture:<name>"`); the payload hash, size and filename are filled in by the harness.
# Default policy: only safetensors and GGUF load; everything else is blocked, malicious files with a specific rule.
# Every negative is paired with a near-miss positive that differs in the one thing under test.

# ---------------------------------------------------------------- pickle execution
- id: art-pickle-os-system-blocked
  control: SEC-ART-01
  kind: negative
  pair: art-pickle-exec
  point: artifact_load
  input: {kind: artifact, filename: auto, sha256: auto, size: auto, local_path: "fixture:pickle_os_system", source: upload}
  expect: {action: block, rule_id: [SEC-ART-01, ART-PICKLE-01]}
  matrix: {monitor: monitor, balanced: block, strict: block, paranoid: block}

- id: art-safetensors-benign-allowed
  control: SEC-ART-01
  kind: positive
  pair: art-pickle-exec
  point: artifact_load
  input: {kind: artifact, filename: auto, sha256: auto, size: auto, local_path: "fixture:benign_safetensors", source: upload}
  expect: {action: allow, rule_id: null}

