# Skills published by Automation Insights (concept §14, §7.3) are models like any other: SEC-MODEL-01 lets only
# the groups that list a skill use it. `skill/loan-memo-summary` is granted to credit-analysts only
# (policy/groups.yaml). Template rendering, preset and tool narrowing are covered by
# gateway/tests/test_insights_api.py (they happen in the request path, before the engine).

- id: insights-skill-credit-analyst-may-use-loan-skill
  control: SEC-MODEL-01
  kind: positive
  pair: insights-skill-developer
  principal: {username: marta, groups: [credit-analysts]}
  model_requested: skill/loan-memo-summary
  input: "Przygotuj notatkę kredytową dla poniższego wniosku:\n\nWnioskodawca <PERSON_1>, kwota 300 000 PLN."
  expect: {action: allow, rule_id: null}

- id: insights-skill-developer-may-not-use-loan-skill
  control: SEC-MODEL-01
  kind: negative
  pair: insights-skill-developer
  principal: {username: piotr, groups: [developers]}
  model_requested: skill/loan-memo-summary
  input: "Przygotuj notatkę kredytową dla poniższego wniosku:\n\nWnioskodawca <PERSON_1>, kwota 300 000 PLN."
  matrix: {balanced: block, strict: block, paranoid: block}
  expect: {action: block, rule_id: SEC-MODEL-01}

