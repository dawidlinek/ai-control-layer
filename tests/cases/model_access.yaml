# SEC-MODEL-01 (model_access): who may use which model.
#
# The in-process case runner always requests `auto` and builds the engine from `policy/` with default deps,
# i.e. WITHOUT the identity wiring. SEC-MODEL-01 therefore runs here with `missing_service: policy_only`
# (group policy + org locks from the loaded policy, no DB grants). DB grants, expiry, revocation, caps and the
# fail-closed behaviour are covered by gateway/tests/test_1c_*.py with the real resolver.
# Groups in policy/groups.yaml that hold `auto`: admins, security-analysts, credit-analysts, developers.

- id: model-access-developers-may-use-auto
  control: SEC-MODEL-01
  kind: positive
  pair: model-access-no-groups
  principal: {username: anna, groups: [developers]}
  input: "Napisz funkcję sortującą listę."
  expect: {action: allow, rule_id: null}

- id: model-access-no-groups-blocked
  control: SEC-MODEL-01
  kind: negative
  pair: model-access-no-groups
  principal: {username: mallory, groups: []}
  input: "Napisz funkcję sortującą listę."
  matrix: {balanced: block, strict: block, paranoid: block}
  expect: {action: block, rule_id: SEC-MODEL-01}

