components:
  schemas:
    Action:
      type: string
      enum:
      - allow
      - monitor
      - redact
      - pseudonymise
      - sanitize
      - route_local
      - downgrade
      - require_approval
      - block
      title: Action
      description: Decision actions (concept §6.3).
    ApiKey:
      properties:
        id:
          type: string
          title: Id
        user_id:
          type: string
          title: User Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
          description: First characters of the key, for identification.
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      additionalProperties: false
      type: object
      required:
      - id
      - user_id
      - name
      - prefix
      - created_at
      title: ApiKey
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - name
      title: ApiKeyCreate
    ApiKeyCreated:
      properties:
        id:
          type: string
          title: Id
        user_id:
          type: string
          title: User Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
          description: First characters of the key, for identification.
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        key:
          type: string
          title: Key
          description: Full key. Returned exactly once; only a hash is stored.
      additionalProperties: false
      type: object
      required:
      - id
      - user_id
      - name
      - prefix
      - created_at
      - key
      title: ApiKeyCreated
    Approval:
      properties:
        id:
          type: string
          title: Id
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        approver_scope:
          type: string
          enum:
          - user
          - admin
          title: Approver Scope
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        requested_by:
          type: string
          title: Requested By
        session_id:
          type: string
          title: Session Id
        trace_id:
          type: string
          title: Trace Id
        tool:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool
        server:
          anyOf:
          - type: string
          - type: 'null'
          title: Server
        arguments_preview:
          type: string
          title: Arguments Preview
          description: Redacted preview (command, diff, recipients).
          default: ''
        reason:
          type: string
          title: Reason
          default: ''
        rule_ids:
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9]*(-[A-Z0-9_.]+)+$
            description: Rule identifier (control id, or control id + sub-rule, or signature id).
          type: array
          title: Rule Ids
        risk_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Risk Score
          default: 0.0
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
