          minimum: 0.0
          title: Weight
          default: 1.0
        contribution:
          type: number
          minimum: 0.0
          title: Contribution
          description: weight × value, after normalisation.
          default: 0.0
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Control id that produced the factor.
      additionalProperties: false
      type: object
      required:
      - factor
      - value
      title: RiskFactor
    RiskFactorName:
      type: string
      enum:
      - intent_deviation
      - tool_sensitivity
      - data_sensitivity
      - chain_anomaly
      - parameter_risk
      title: RiskFactorName
      description: Graded risk-score factors (concept §6.5).
    RouteInfo:
      properties:
        model_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Requested
        model:
          type: string
          title: Model
          description: Resolved public model id, e.g. `local/general`.
        connector:
          type: string
          title: Connector
        tier:
          $ref: '#/components/schemas/ConnectorTier'
        reason:
          type: string
          title: Reason
          examples:
          - 'auto → local/loan-memo-pl: task=loan_memo (0.91), data=confidential → local'
        degraded:
          type: boolean
          title: Degraded
          default: false
        factors:
          additionalProperties: true
          type: object
          title: Factors
      additionalProperties: false
      type: object
      required:
      - model
      - connector
      - tier
      - reason
      title: RouteInfo
    SessionLabels:
      properties:
        integrity:
          $ref: '#/components/schemas/Integrity'
          default: trusted
        confidentiality:
          $ref: '#/components/schemas/DataClass'
          default: public
        taint:
          items:
            $ref: '#/components/schemas/TaintFlag'
          type: array
          title: Taint
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Rule ids that raised the labels.
      additionalProperties: false
      type: object
      title: SessionLabels
      description: IFC labels carried by a session (concept §9). Only ever raised without approval.
    Severity:
      type: string
      enum:
      - info
      - low
      - medium
      - high
      - critical
      title: Severity
    StageLatency:
      properties:
        phase:
          type: string
          title: Phase
        control_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Control Id
        count:
          type: integer
          title: Count
        p50_ms:
          type: number
          title: P50 Ms
        p95_ms:
          type: number
          title: P95 Ms
        p99_ms:
          type: number
          title: P99 Ms
      additionalProperties: false
      type: object
      required:
      - phase
      - count
      - p50_ms
      - p95_ms
      - p99_ms
      title: StageLatency
    TaintFlag:
      type: string
      enum:
      - untrusted
      - sensitive
      - egress_used
      title: TaintFlag
    Taxonomy:
      properties:
        owasp_llm:
          items:
            type: string
          type: array
          title: Owasp Llm
          examples:
          - - LLM01:2025
        owasp_agentic:
          items:
            type: string
          type: array
          title: Owasp Agentic
          examples:
          - - ASI01
        owasp_mcp:
          items:
            type: string
          type: array
          title: Owasp Mcp
          examples:
          - - MCP03
        atlas:
          items:
            type: string
          type: array
          title: Atlas
          examples:
          - - AML.T0051
        cve:
          items:
            type: string
          type: array
          title: Cve
      additionalProperties: false
      type: object
      title: Taxonomy
      description: Framework tags attached to rules and events (concept §13).
    ToolLabel:
      type: string
      enum:
      - reads_untrusted
      - touches_sensitive
      - external_egress
      - irreversible
      title: ToolLabel
    ToolTier:
      type: string
      enum:
      - deny
      - must
      - allow
      - confirm
      title: ToolTier
      description: Tool policy tiers (concept §9).
    Usage:
      properties:
        input_tokens:
          type: integer
          title: Input Tokens
          default: 0
        output_tokens:
          type: integer
          title: Output Tokens
          default: 0
        reasoning_tokens:
          type: integer
          title: Reasoning Tokens
          default: 0
        usd:
          type: number
          title: Usd
          default: 0.0
        gpu_seconds:
          type: number
          title: Gpu Seconds
          default: 0.0
        guard_tokens:
          type: integer
          title: Guard Tokens
          default: 0
        guard_gpu_seconds:
          type: number
          title: Guard Gpu Seconds
          default: 0.0
        cache_hit:
          type: boolean
          title: Cache Hit
          default: false
      additionalProperties: false
      type: object
      title: Usage
    User:
      properties:
        id:
          type: string
          title: Id
        subject:
          type: string
          title: Subject
        username:
          type: string
          title: Username
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        kind:
          $ref: '#/components/schemas/PrincipalKind'
          default: user
        groups:
          items:
            type: string
          type: array
          title: Groups
        roles:
          items:
            type: string
          type: array
          title: Roles
        first_seen:
          type: string
          format: date-time
          title: First Seen
        last_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen
        disabled:
          type: boolean
          title: Disabled
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - subject
      - username
      - first_seen
      title: User
    ValidateRequest:
      properties:
        files:
          additionalProperties:
            type: string
          type: object
          title: Files
          description: Candidate file contents by name; omitted files use the current version.
      additionalProperties: false
      type: object
      required:
      - files
      title: ValidateRequest
    ValidateResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        errors:
          items:
            $ref: '#/components/schemas/PolicyError'
          type: array
          title: Errors
        candidate_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Version
      additionalProperties: false
      type: object
      required:
      - valid
      title: ValidateResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerdictStatus:
      type: string
      enum:
      - ok
      - cached
      - timeout
      - error
      - skipped
      title: VerdictStatus
    Versions:
      properties:
        policy:
          type: string
          title: Policy
          description: Compiled policy version id.
        grants:
          type: string
          title: Grants
          description: Grants-table version (monotonic).
          default: '0'
        signatures:
          type: string
          title: Signatures
          description: Signature bundle version.
          default: '0'
        classifiers:
          additionalProperties:
            type: string
          type: object
          title: Classifiers
        judges:
          additionalProperties:
            type: string
          type: object
          title: Judges
        gateway:
          type: string
          title: Gateway
          default: 0.1.0
      additionalProperties: false
      type: object
      required:
      - policy
      title: Versions
      description: Everything needed to replay a decision (concept §13).
  securitySchemes:
    HTTPBearer:
      type: http
      description: Keycloak access token (JWT) or personal API key (`acl_...`).
      scheme: bearer
servers:
- url: http://localhost:8000
