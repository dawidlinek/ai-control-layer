        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
      - name: group
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Group
      - name: agent
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent
      - name: control
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
