      tags:
      - access
      summary: Revoke Grant
      operationId: revokeGrant
      security:
      - HTTPBearer: []
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: reason
        in: query
        required: true
        schema:
          type: string
          title: Reason
      responses:
