      summary: Get User
      operationId: getUser
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid credentials
        '403':
          description: Insufficient role / forbidden resource
        '501':
          description: Not implemented yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/users/{user_id}/effective-access:
    get:
      tags:
      - access
      summary: Effective Access
      description: 'Resolved access with sources: org locks → group grants → user grants (with expiry).'
      operationId: getEffectiveAccess
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAccess'
        '401':
          description: Missing or invalid credentials
        '403':
          description: Insufficient role / forbidden resource
        '501':
          description: Not implemented yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/users/{user_id}/activity:
    get:
      tags:
