          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
                title: Response Listevents
        '401':
          description: Missing or invalid credentials
        '403':
          description: Insufficient role / forbidden resource
        '501':
          description: Not implemented yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/events/stream:
    get:
      tags:
      - events
      summary: Stream Events
      operationId: streamEvents
      security:
      - HTTPBearer: []
      parameters:
      - name: subject
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Action'
          - type: 'null'
          title: Action
      responses:
        '200':
          description: Server-sent events; each `data:` line is an EventSummary JSON object.
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '401':
          description: Missing or invalid credentials
        '403':
          description: Insufficient role / forbidden resource
        '501':
          description: Not implemented yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/events/{event_id}:
    get:
      tags:
      - events
      summary: Get Event
      description: Full decision trace (the audit record) for one event.
      operationId: getEvent
      security:
      - HTTPBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
